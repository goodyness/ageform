<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Declined</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <section class="card" id="connectionLostPage">
      <div class="top-email" id="displayPlayerName">Player: </div>
      <p class="eyebrow">SESSION ENDED</p>
      <h1>Session declined</h1>
      <p class="muted">The operator declined this session. You can start a new one below.</p>
      <p class="muted" style="font-size:13px;margin-top:6px;">Waiting in case the operator reconnects…</p>
      <a class="button" href="index.html" style="margin-top:20px;">Start over</a>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
