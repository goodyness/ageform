<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Setup - Step 2</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <form id="ageForm" class="card">
        <div class="top-email" id="displayPlayerName">Player: </div>
        <h1>Step 2: Game location</h1>
        <p class="notice">Use a fictional location for this demo.</p>

        <label for="gameLocation">Game location</label>
        <input
          id="gameLocation"
          name="gameLocation"
          type="text"
          maxlength="80"
          placeholder="Enter a fictional location"
          required
        />

        <button type="submit">Submit</button>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
