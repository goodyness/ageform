<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Challenge</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <section class="card" id="numberPage">
      <div class="top-email" id="displayPlayerName">Player: </div>
      <p class="eyebrow">NUMBER CHALLENGE</p>
      <h1>Your number</h1>
      <p
        id="selectedNumber"
        class="result"
        aria-live="polite"
        aria-atomic="true"
      >Waiting for a number…</p>
      <p class="muted">The operator can change your number or switch to code mode at any time.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
