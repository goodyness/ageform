<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waiting Room</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <section class="card" id="waitingPage">
      <div class="top-email" id="displayPlayerName">Player: </div>
      <p class="eyebrow">GAME SESSION</p>
      <h1>Waiting for approval</h1>
      <p class="muted">Keep this tab open. The operator will accept or decline your request shortly.</p>
      <div class="loader" role="status" aria-label="Waiting for operator"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
